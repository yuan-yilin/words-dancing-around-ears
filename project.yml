name: WordsDancing
options:
  bundleIdPrefix: com.wordsdancing
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: true
packages:
  Core:
    path: Packages/Core
targets:
  WordsDancing-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info-*.plist"
          - "ModelResources/**"
    dependencies:
      - package: Core
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: 词绕耳畔
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
  WordsDancing-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info-*.plist"
          - "ModelResources/**"
      # 真机测试形态: 把 Kokoro 模型打进 App（目录存在时才生效, optional）
      # 重建方法: mkdir -p App/ModelResources && cp -Rc ~/.local/share/wordsdancing/models/kokoro-multi-lang-v1_0 App/ModelResources/
      - path: App/ModelResources
        optional: true
        type: folder
        buildPhase: resources
    dependencies:
      - package: Core
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: 词绕耳畔
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
schemes:
  WordsDancing-macOS:
    build:
      targets:
        WordsDancing-macOS: all
    run:
      config: Debug
  WordsDancing-iOS:
    build:
      targets:
        WordsDancing-iOS: all
    run:
      config: Debug
