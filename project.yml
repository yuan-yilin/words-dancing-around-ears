name: WordsDancing
options:
  bundleIdPrefix: com.wordsdancing
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: true
packages:
  Core:
    path: Packages/Core
targets:
  WordsDancing-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Core
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: 词绕耳畔
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
  WordsDancing-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Core
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: 词绕耳畔
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
schemes:
  WordsDancing-macOS:
    build:
      targets:
        WordsDancing-macOS: all
    run:
      config: Debug
  WordsDancing-iOS:
    build:
      targets:
        WordsDancing-iOS: all
    run:
      config: Debug
